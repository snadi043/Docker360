apiVersion: apps/v1
kind: Deployment
metadata: 
  name: auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata: 
      labels:
        app : auth
    spec:
      containers:
        - name: auth
          image: snadi043/docker_kubernetes_networking_auth_api
        

    
  